# Advanced Sway configuration: modes, criteria, input

set $mod Mod4

# Font
font pango:monospace 10

# Gaps
gaps inner 10
gaps outer 5

# Default border
default_border pixel 2

# Focus behavior
focus_follows_mouse yes

# Output configuration
output eDP-1 resolution 2560x1440 scale 2 position 0 0
output HDMI-A-1 resolution 1920x1080 position 2560 0

# Input configuration
input "1:1:AT_Translated_Set_2_keyboard" {
    xkb_layout us
    xkb_options caps:escape
}

input "2:7:SynPS/2_Synaptics_TouchPad" {
    tap enabled
    natural_scroll enabled
}

# Window rules
for_window [app_id="firefox"] floating enable
for_window [title="Picture-in-Picture"] floating enable
for_window [app_id="pavucontrol"] floating enable, resize set 800 600

# Workspace output assignment
workspace 1 output eDP-1
workspace 2 output eDP-1
workspace 3 output HDMI-A-1

# Key bindings
bindsym $mod+Return exec alacritty
bindsym $mod+Shift+q kill

# Startup
exec waybar
exec_always --no-startup-id kanshi
