# Full-featured Sway configuration for comprehensive testing

set $mod Mod4
set $term foot
set $menu wofi --show drun
set $lock swaylock -f -c 000000

# Font
font pango:JetBrains Mono 11

# Appearance
default_border pixel 3
default_floating_border normal 2
gaps inner 8
gaps outer 4

# Focus
focus_follows_mouse yes

# Output configuration
output eDP-1 {
    resolution 3840x2160
    scale 2
    position 0 0
}
output DP-1 {
    resolution 2560x1440
    position 1920 0
}
output * bg /usr/share/backgrounds/sway/default.png fill

# Input
input "type:keyboard" {
    xkb_layout "us,de"
    xkb_options "grp:alt_shift_toggle,caps:escape"
    repeat_delay 300
    repeat_rate 50
}

input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    dwt enabled
    accel_profile adaptive
    pointer_accel 0.3
}

# Key bindings - basic
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+Shift+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit sway?' -B 'Yes' 'swaymsg exit'

# Navigation
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move windows
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# Layout
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent

# Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5

# Scratchpad
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# Window rules
for_window [app_id="firefox"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable
for_window [window_role="pop-up"] floating enable
for_window [app_id="thunar"] floating enable, resize set 900 600

# Workspace assignments
workspace 1 output eDP-1
workspace 2 output eDP-1
workspace 3 output DP-1
workspace 4 output DP-1

# Autostart
exec waybar
exec mako
exec_always --no-startup-id kanshi
exec_always --no-startup-id autotiling

# Idle / Lock
exec swayidle -w \
    timeout 300 '$lock' \
    timeout 600 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    before-sleep '$lock'

# Floating modifier
floating_modifier $mod normal
