[package]
name = "rway"
version = "0.1.0"
description = "A modern Sway replacement Wayland compositor built on Smithay"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rway-tiling = { path = "../rway-tiling" }
rway-config = { path = "../rway-config" }
rway-ipc = { path = "../rway-ipc" }

cosmic-text = "0.12"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
serde_json = "1"
thiserror = "1"
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"

# DRM/udev 后端依赖
smithay-drm-extras = { version = "0.1", optional = true, default-features = false }
xcursor = { version = "0.3", optional = true }
x11rb = { version = "0.13", optional = true, default-features = false, features = ["composite"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "desktop",
    "wayland_frontend",
    "renderer_gl",
]

[features]
default = ["winit", "udev", "xwayland"]
winit = ["smithay/backend_winit", "smithay/backend_egl"]
udev = [
    "smithay-drm-extras",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_egl",
    "smithay/backend_session_libseat",
    "smithay/renderer_gl",
    "smithay/renderer_pixman",
    "smithay/renderer_multi",
    "smithay/use_system_lib",
    "xcursor",
]
xwayland = [
    "smithay/xwayland",
    "smithay/x11rb_event_source",
    "x11rb",
    "xcursor",
]
